<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinguaFlow AI V2</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#18202a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;display:flex}.side{width:230px;background:#111827;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:800;margin-bottom:20px}.nav button{display:block;width:100%;padding:10px;margin:5px 0;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:left}.nav button:hover,.nav button.active{background:#263244;color:#fff}.main{margin-left:230px;padding:24px;width:calc(100% - 230px);max-width:1400px}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px;box-shadow:0 3px 12px #00000008}.muted{color:#6b7280}.stat{font-size:30px;font-weight:800;margin:7px 0}.btn{padding:9px 13px;border-radius:9px;border:1px solid #ddd;background:#fff;cursor:pointer}.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.danger{background:#dc2626;color:#fff;border-color:#dc2626}.input,.area{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px}.area{min-height:130px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.reader{font-size:18px;line-height:1.95}.word{border:0;background:transparent;color:#3730a3;font-weight:700;border-bottom:1px dashed #818cf8;padding:0 2px;cursor:pointer}.chip{display:inline-block;background:#f1f5f9;border-radius:999px;padding:4px 8px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.mobile{display:none}@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:15px 15px 70px}.g4,.g3,.g2{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:5}.mobile button{flex:1;border:0;background:#fff;padding:12px 4px}.reader{font-size:17px}}</style></head><body><div class=app><aside class=side><div class=brand>LinguaFlow AI</div><div class=nav><button data-go=home>⌂ 学习概览</button><button data-go=reader>📖 智能阅读</button><button data-go=vocab>🔤 我的词库</button><button data-go=review>↻ 今日复习</button><button data-go=library>▤ 资源库</button><button data-go=stats>◫ 学习数据</button><button data-go=settings>⚙ 设置</button></div></aside><main class=main><h1 id=title>学习概览</h1><section class=page data-p=home id=home></section><section class=page data-p=reader id=reader style="display:none"></section><section class=page data-p=vocab id=vocab style="display:none"></section><section class=page data-p=review id=review style="display:none"></section><section class=page data-p=library id=library style="display:none"></section><section class=page data-p=stats id=stats style="display:none"></section><section class=page data-p=settings id=settings style="display:none"></section></main></div><div class=mobile><button data-go=home>首页</button><button data-go=reader>阅读</button><button data-go=vocab>词库</button><button data-go=review>复习</button><button data-go=stats>我的</button></div><div id=modal class=modal><div class=box><div class=row style="justify-content:space-between"><h2 id=mt></h2><button class=btn onclick="$('#modal').classList.remove('show')">关闭</button></div><div id=mb></div></div></div><script>const KEY='linguaflow_state';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{version:'V2',articles:[{id:1,title:'The Future of Artificial Intelligence',source:'Demo',text:'Artificial intelligence is changing the way people learn, work, and communicate.\nAlthough the technology has developed rapidly, its impact on education depends on how teachers and students choose to use it.\nA thoughtful approach can help learners build useful skills while avoiding unnecessary dependence on technology.'}],vocab:[{word:'artificial',meaning:'人工的；人造的',pos:'adj.',mastery:1,next:Date.now()},{word:'fundamentally',meaning:'从根本上；本质上',pos:'adv.',mastery:2,next:Date.now()},{word:'depend',meaning:'依靠；取决于',pos:'v.',mastery:0,next:Date.now()}],history:[],settings:{}};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){alert(t)}function page(n){$$('.page').forEach(x=>x.style.display=x.dataset.p===n?'block':'none');$$('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===n));$('#title').textContent={home:'学习概览',reader:'智能阅读',vocab:'我的词库',review:'今日复习',library:'资源库',stats:'学习数据',settings:'设置'}[n];if(n==='home')home();if(n==='reader')reader();if(n==='vocab')vocab();if(n==='review')review();if(n==='library')library();if(n==='stats')stats();if(n==='settings')settings()}function nav(){$$('[data-go]').forEach(x=>x.onclick=()=>page(x.dataset.go))}function card(a,b,c=''){return `<div class=card><div class=muted>${a}</div><div class=stat>${b}</div><div class=muted>${c}</div></div>`}function home(){$('#home').innerHTML=`<div class='grid g4'>${card('阅读文章',state.articles.length,'篇')}${card('词库词汇',state.vocab.length,'个')}${card('已掌握',state.vocab.filter(x=>x.mastery>=3).length,'个')}${card('学习记录',state.history.length,'次')}</div><div class='grid g2' style='margin-top:15px'><div class=card><h2>今日任务</h2><p>阅读1篇、复习10词、精读2个长难句。</p><button class='btn primary' onclick="page('reader')">开始阅读</button></div><div class=card><h2>学习建议</h2><p>${advice()}</p></div></div>`}function advice(){let d=state.vocab.filter(x=>(x.next||0)<=Date.now()).length;if(d>=10)return`今天有 ${d} 个词到期，建议先复习再学新词。`;if(state.vocab.length<20)return'继续阅读并只收录真正影响理解的词汇。';return'保持阅读→标记→复习→复盘的学习闭环。'}function reader(){let a=state.articles[0];if(!a){$('#reader').innerHTML='<div class=card>暂无文章</div>';return}let t=esc(a.text);['artificial','fundamentally','depend','thoughtful','technology','impact','education'].forEach(w=>t=t.replace(new RegExp('\\\\b'+w+'\\\\b','gi'),m=>`<button class=word onclick="word('${m.toLowerCase()}')">${m}</button>`));$('#reader').innerHTML=`<div class=card><div class=row style='justify-content:space-between'><h2>${esc(a.title)}</h2><button class='btn primary' onclick='sentence()'>AI长难句分析</button></div><div class=reader>${t.split('\\n').map(x=>'<p>'+x+'</p>').join('')}</div></div><div class=card style='margin-top:15px'><h3>导入文本</h3><textarea id=txt class=area placeholder='粘贴英文文章'></textarea><div class=row><input id=ttl class=input style='max-width:280px' placeholder='标题'><button class='btn primary' onclick='importText()'>导入</button><input type=file id=file hidden accept='.txt,.md,.html' onchange='fileIn(this)'><button class=btn onclick="$('#file').click()">上传TXT/MD/HTML</button></div></div>`}function importText(){let t=$('#txt').value.trim();if(!t)return toast('请先输入文章');state.articles.unshift({id:Date.now(),title:$('#ttl').value||'未命名文章',source:'手动导入',text:t});state.history.push({type:'import',at:Date.now()});save();reader();toast('导入成功')}function fileIn(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.articles.unshift({id:Date.now(),title:f.name,source:'文件',text:String(r.result).replace(/<[^>]+>/g,' ')});save();reader()};r.readAsText(f)}function word(w){let d={artificial:['人工的；人造的','adj.','made by humans rather than occurring naturally','★★★★★'],fundamentally:['从根本上；本质上','adv.','in a basic and essential way','★★★★★'],depend:['依靠；取决于','v.','to rely on or be determined by','★★★★☆'],thoughtful:['深思熟虑的；体贴的','adj.','showing careful consideration','★★★☆☆'],technology:['技术；科技','n.','knowledge and tools used to solve practical problems','★★★★☆'],impact:['影响；冲击','n./v.','a strong effect or influence','★★★★★'],education:['教育','n.','the process of teaching and learning','★★★★☆']}[w]||['结合上下文理解','word','暂无本地词典条目','★★★☆☆'];$('#mt').textContent=w;$('#mb').innerHTML=`<p><span class=chip>${d[1]}</span> <b>${d[0]}</b></p><p><b>英文解释：</b>${d[2]}</p><p><b>考试重要度：</b>${d[3]}</p><p><b>相关词：</b>${w==='fundamentally'?'fundamental / foundation':w+' 的派生词、搭配和同义表达'}</p><button class='btn primary' onclick="add('${w}','${d[0]}','${d[1]}')">加入词库</button><p class=muted>免费本地模式：当前不调用付费API。</p>`;$('#modal').classList.add('show')}function add(w,m,p){if(!state.vocab.some(x=>x.word===w))state.vocab.push({word:w,meaning:m,pos:p,mastery:0,next:Date.now()});save();toast('已加入词库')}function sentence(){$('#mt').textContent='AI长难句分析（免费本地模式）';$('#mb').innerHTML=`<p><b>Although the technology has developed rapidly, its impact on education depends on how teachers and students choose to use it.</b></p><h3>① 主干</h3><p>its impact on education → depends on → how teachers and students choose to use it</p><h3>② 从句</h3><p>Although... 是让步状语从句；how... 是宾语从句。</p><h3>③ 重点结构</h3><p>depend on 表示“取决于”；choose to do 表示“选择做某事”。</p><h3>④ 翻译</h3><p>尽管这项技术发展迅速，但它对教育的影响取决于师生如何选择使用它。</p><h3>⑤ 考点</h3><p>让步状语从句、宾语从句、固定搭配。</p>`;$('#modal').classList.add('show')}function vocab(){$('#vocab').innerHTML=`<div class=card><h2>我的词库</h2><table><tr><th>单词</th><th>释义</th><th>掌握度</th><th>操作</th></tr>${state.vocab.map(v=>`<tr><td><b>${esc(v.word)}</b></td><td>${esc(v.meaning)}</td><td>${v.mastery}/5</td><td><button class=btn onclick="reviewOne('${esc(v.word)}')">复习</button></td></tr>`).join('')}</table></div>`}function reviewOne(w){let v=state.vocab.find(x=>x.word===w);$('#mt').textContent='复习：'+w;$('#mb').innerHTML=`<h2>${esc(w)}</h2><p>${esc(v.meaning)}</p><div class=row><button class='btn danger' onclick="grade('${w}',0)">忘记</button><button class=btn onclick="grade('${w}',2)">模糊</button><button class='btn primary' onclick="grade('${w}',4)">记住</button></div>`;$('#modal').classList.add('show')}function grade(w,g){let v=state.vocab.find(x=>x.word===w);v.mastery=Math.max(0,Math.min(5,v.mastery+(g>=4?1:g===2?0:-1)));let days=[1,3,7,15,30,60][v.mastery];if(g===0)days=1;if(g===2)days=Math.max(1,Math.round(days*.65));v.next=Date.now()+days*86400000;state.history.push({type:'review',word:w,grade:g,days,at:Date.now()});save();$('#modal').classList.remove('show');review();vocab()}function review(){$('#review').innerHTML=`<div class=card><h2>今日复习</h2>${state.vocab.filter(v=>(v.next||0)<=Date.now()).map(v=>`<div class=card style='margin:9px 0'><b>${esc(v.word)}</b>　${esc(v.meaning)} <button class='btn primary' onclick="reviewOne('${esc(v.word)}')">复习</button></div>`).join('')||'<p class=muted>今天没有到期词汇。</p>'}</div>`}function library(){$('#library').innerHTML=`<div class='grid g3'>${state.articles.map(a=>`<div class=card><h3>${esc(a.title)}</h3><p class=muted>${esc(a.source)}</p><p>${esc(a.text.slice(0,130))}…</p></div>`).join('')}</div>`}function stats(){$('#stats').innerHTML=`<div class='grid g3'>${card('阅读',state.articles.length,'篇')}${card('词汇',state.vocab.length,'个')}${card('复习记录',state.history.filter(x=>x.type==='review').length,'次')}</div><div class=card style='margin-top:15px'><h2>当前学习画像</h2><p>词汇掌握率：${state.vocab.length?Math.round(state.vocab.filter(x=>x.mastery>=3).length/state.vocab.length*100):0}%</p><p>${advice()}</p></div>`}function settings(){$('#settings').innerHTML=`<div class=card><h2>设置</h2><p>当前版本：${state.version}</p><p class=muted>AI模式：免费本地分析。</p><button class='btn danger' onclick="localStorage.removeItem(KEY);location.reload()">重置本地数据</button></div>`}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',\"'\":'&#39;'}[m]))}nav();page('home');
</script></body></html>
